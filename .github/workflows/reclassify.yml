name: Reclassificar Sentimentos
on:
  workflow_dispatch:
jobs:
  reclassify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reclassificar todas as noticias
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          KEYWORDS: ${{ secrets.KEYWORDS }}
        run: |
          python -c "import os,json,urllib.request,urllib.error;url=os.environ['SUPABASE_URL']+'/rest/v1/monitored_news';key=os.environ['SUPABASE_KEY'];hdr={'apikey':key,'Authorization':'Bearer '+key,'Prefer':'return=representation'};body={'sentimento':None,'conteudo':None};req=urllib.request.Request(url,data=json.dumps(body).encode(),method='PATCH',headers=hdr);r=urllib.request.urlopen(req,timeout=30);print('SUCCESS: Todas as noticias tiveram sentimento e conteudo zerados.')"
