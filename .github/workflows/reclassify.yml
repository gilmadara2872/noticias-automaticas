name: Reclassificar Sentimentos
on:
  workflow_dispatch:
    inputs:
      lote:
        description: 'Links (um por linha) para reclassificar. Vazio = todas.'
        required: false
        type: string
jobs:
  reclassify:
    runs-on: ubuntu-latest
    # Reclassificar todas as noticias por IA leva ~5s cada.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reclassificar todas as noticias
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          # O sentiment.py avisa no Telegram quando alguma classificacao cai
          # no lexico de reserva. Sem estes dois o aviso ia para uma URL vazia
          # e o Telegram respondia 404 - o alarme sumia sem deixar rastro.
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # Vaem por variavel de ambiente, nao interpolados no script.
          LOTE: ${{ inputs.lote }}
        run: |
          cd github-actions
          pip install -r requirements.txt 2>/dev/null || true
          # LOTE opcional: um link por linha. Sem este argumento, processa
          # tudo (comportamento antigo). Existe porque a OpenRouter da 50
          # requisicoes/dia: uma reclassificacao de 47_noticias usa 49 delas
          # e nao sobra nada para uma segunda tentativa no mesmo dia.
          #
          # Os links vao por ARQUIVO, nunca embutidos no shell: URLs do
          # Google News trazem aspas e & que corrompiam o script
          # ("syntax error: unexpected end of file"). O here-doc entre
          # aspas simples impede o shell de interpretar o conteudo.
          if [ -n "$LOTE" ]; then
            printf '%s' "$LOTE" > lote.txt
            python sentiment.py --force --lote lote.txt
          else
            python sentiment.py --force
