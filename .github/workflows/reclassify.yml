name: Reclassificar Sentimentos
on:
  workflow_dispatch:
jobs:
  reclassify:
    runs-on: ubuntu-latest
    # Reclassificar todas as noticias por IA leva ~5s cada.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reclassificar todas as noticias
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          # O sentiment.py avisa no Telegram quando alguma classificacao cai
          # no lexico de reserva. Sem estes dois o aviso ia para uma URL vazia
          # e o Telegram respondia 404 - o alarme sumia sem deixar rastro.
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          cd github-actions
          pip install -r requirements.txt 2>/dev/null || true
          # Lote opcional: um link por linha, em github-actions/lote.txt
          #
          # POR QUE O INPUT FOI ABANDONADO: passar os links pelo input do
          # workflow quebrava o shell em dois jeitos seguidos -
          #   1) interpolado no script, aspas e & da URL corrompiam o codigo
          #   2) via variavel de ambiente, o GitHub ainda quebrava: o valor
          #      multilinha era despejado no script antes do env, e o
          #      resultado era "syntax error: unexpected end of file".
          #
          # Por isso o lote vai por ARQUIVO versionado no repositorio. Sem
          # entrada do usuario no shell, nao ha o que quebrar. O arquivo e
          # opcional: se nao existir, processa tudo.
          if [ -f lote.txt ]; then
            n=$(grep -c . lote.txt || true)
            echo "Lote detectado: $n link(s)"
            python sentiment.py --force --lote lote.txt
          else
            echo "Sem lote.txt: reclassificando todas as noticias."
            python sentiment.py --force
          fi
