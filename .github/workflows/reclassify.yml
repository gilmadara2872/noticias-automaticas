name: Reclassificar Sentimentos
on:
  workflow_dispatch:
jobs:
  reclassify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reclassificar todas as noticias
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          KEYWORDS: ${{ secrets.KEYWORDS }}
        run: |
          pip install -r github-actions/requirements.txt 2>/dev/null || true
          python reclassificar.py
